<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <title>Order Example - Toss Front SDK</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      
      const onIdle = () => {
        sdk.template.renderIdlePage({
          type: 'twoButton',
          title: {
            text1: '프론트',
            text2: '플러그인',
          },
          description: {
            text: '프론트 플러그인 예시 템플릿입니다.',
            subText: '자세한 내용은 개발자센터를 참고해주세요.',
          },
          primaryButton: {
            text: '로그인',
            onClick: () => {
              location.href = "./onboarding.html";
            },
          },
          secondaryButton: {
            text: '결제하기',
            onClick: () => {
              location.href = "./order.html";
            },
          },
        })
      };

      onIdle();
    </script>
  </body>
</html>
