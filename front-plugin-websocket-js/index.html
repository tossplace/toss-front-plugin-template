<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v1/index.js"></script>
    <script src="./sdk.js"></script>
    <title>Order Example - Toss Front SDK</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // ===== 상태 관리 =====
      let websocketServer = null;
      let currentConnectionId = null;

      // ===== 로그 유틸리티 =====
      function log(message) {
        // log 전송
      }
      const onIdle = () => {
        sdk.template.renderIdlePage();
      };

      // ===== 1. 메시지 송신 =====
      const sendMessage = async (connectionId, data) => {
        try {
          await websocketServer.send(
            connectionId,
            typeof data === "string" ? data : JSON.stringify(data),
          );
          log(`[WebSocket] << ${JSON.stringify(data)}`);
        } catch (error) {
          log(`[Error] WebSocket Send: ${error}`);
        }
      };

      // ===== 2. 특정 연결 종료 =====
      const disconnectClient = async (connectionId) => {
        try {
          await websocketServer.disconnect(connectionId);
          log(`[WebSocket] Disconnected: ${connectionId}`);
        } catch (error) {
          log(`[Error] WebSocket Disconnect: ${error}`);
        }
      };

      // ===== 3. 메시지 수신 처리 =====
      const handleMessage = (payload) => {
        log(`[WebSocket] >> ${payload.data}`);

        try {
          const data = JSON.parse(payload.data);

          if (data.name === "ping") {
            sendMessage(payload.connectionId, {
              name: "pong",
              data: data.data,
            });
          } else if (data.name === "updateOrder") {
            sdk.template.renderOrderPage({
              order: data.data,
              onBack: () => {
                onIdle();
              },
            });
          } else if (data.name === "clear") {
            onIdle();
          }
        } catch (error) {
          log(`[Error] Message parse: ${error}`);
        }
      };

      // ===== 4. WebSocket 서버 시작 =====
      // start는 서버 열기와 connection별 이벤트 리스너 등록/정리를 한 번에 처리합니다.
      const initWebsocketServer = async () => {
        try {
          websocketServer = await sdk.websocket.start({
            port: 9000,
            path: "/",

            // 새로운 연결 수신
            onConnection: (payload) => {
              log(`[WebSocket] New connection: ${payload.connectionId}`);
              currentConnectionId = payload.connectionId;
            },

            // 메시지 수신
            onMessage: handleMessage,

            // 연결 종료 수신
            onDisconnection: (payload) => {
              log(
                `[WebSocket] Disconnected: ${payload.connectionId} (reason: ${payload.reason || "unknown"})`,
              );

              // 현재 connection 초기화
              if (currentConnectionId === payload.connectionId) {
                currentConnectionId = null;
              }
            },

            // 오류 수신
            onError: (payload) => {
              log(`[WebSocket] Error: ${payload.message}`);
            },
          });

          const { serverId, host, port, path } = websocketServer;
          log(
            `[WebSocket] Server started: ${JSON.stringify({ serverId, host, port, path })}`,
          );

          // stop은 모든 리스너 해제와 서버 종료를 함께 수행합니다.
          window.addEventListener("beforeunload", () => {
            log("[Cleanup] Before unload...");
            websocketServer.stop();
          });
        } catch (error) {
          log(`[Error] Init WebSocket: ${error}`);
        }
      };

      // ===== 초기화 =====
      function init() {
        onIdle();
        initWebsocketServer();
      }

      init();
    </script>
  </body>
</html>
